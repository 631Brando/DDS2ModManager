# Builds and tests every push and pull request.
#
# Live-API tests are EXCLUDED here (Category!=Live). They talk to real GitHub and Nexus
# endpoints, and a build going red because a runner got rate-limited teaches nobody anything -
# it just trains people to ignore red. Run them deliberately with:
#
#     dotnet test --filter Category=Live
#
# There is a scheduled job below that does exactly that, once a day, so an API changing shape
# underneath us still gets noticed - just not in a way that blocks a merge.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # 07:00 UTC daily, for the live-API job only.
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DDS2ModManager.sln

      # Warnings are informative here rather than fatal: the app targets a preview-ish SDK and
      # a transitive package advisory should not stop someone merging a fix.
      - name: Build
        run: dotnet build DDS2ModManager.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/DDS2ModManager.Tests/DDS2ModManager.Tests.csproj -c Release --no-build --filter "Category!=Live" --logger "console;verbosity=normal"

  live-api:
    name: Live API contract
    # Only on the schedule and on demand - never gates a push or a PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Live API tests
        run: dotnet test tests/DDS2ModManager.Tests/DDS2ModManager.Tests.csproj -c Release --filter "Category=Live" --logger "console;verbosity=normal"
        continue-on-error: true

      - name: Note
        if: failure()
        run: echo "Live API tests failed - GitHub or Nexus may have changed shape, or the runner was rate limited."
