# Builds the self-contained single-file exe for both DDS2ModManager and its installer, then
# publishes them as assets on a GitHub Release matching the pushed tag.
#
# AppUpdateService (in-app updater) and DDS2ModManagerSetup (installer) both expect the main
# app's release asset to be named exactly "DDS2ModManager.exe" - don't rename it without updating
# AssetName in src/Services/AppUpdateService.cs and setup/MainWindow.xaml.cs to match.
#
# Trigger: push a tag like "v1.2.0" (git tag v1.2.0 && git push origin v1.2.0).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish DDS2 Mod Manager
        run: dotnet publish src/DDS2ModManager.csproj -c Release

      - name: Publish Setup
        run: dotnet publish setup/DDS2ModManagerSetup.csproj -c Release

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "src/bin/Release/net10.0-windows/win-x64/publish/DDS2ModManager.exe" `
            "setup/bin/Release/net10.0-windows/win-x64/publish/DDS2ModManagerSetup.exe" `
            --title "${{ github.ref_name }}" --generate-notes
